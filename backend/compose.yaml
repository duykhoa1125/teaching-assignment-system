services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tass
      POSTGRES_USER: tass
      POSTGRES_PASSWORD: tass_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro

volumes:
  postgres_data:
