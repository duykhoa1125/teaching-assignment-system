spring.application.name=tass-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tass}
spring.datasource.username=${DB_USER:tass}
spring.datasource.password=${DB_PASSWORD:tass_dev}
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
tass.solver.concurrent-runs=${SOLVER_CONCURRENT_RUNS:1}
tass.solver.queue-capacity=${SOLVER_QUEUE_CAPACITY:8}
