name: tass-dev

x-database-check: &database-check
  test: ["CMD", "sh", "/opt/tass/db-healthcheck.sh"]
  interval: 5s
  timeout: 5s
  start_period: 30s
  retries: 20

x-database-tools-env: &database-tools-env
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: ${POSTGRES_DB:-tass}
  PGUSER: ${POSTGRES_USER:-tass}
  PGPASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env before starting}

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tass}
      POSTGRES_USER: ${POSTGRES_USER:-tass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env before starting}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/sql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./infra/docker/db-healthcheck.sh:/opt/tass/db-healthcheck.sh:ro
    healthcheck: *database-check
    restart: unless-stopped

  backend:
    image: tass-backend:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tass}
      DB_USER: ${POSTGRES_USER:-tass}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env before starting}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      SOLVER_CONCURRENT_RUNS: ${SOLVER_CONCURRENT_RUNS:-1}
      SOLVER_QUEUE_CAPACITY: ${SOLVER_QUEUE_CAPACITY:-8}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=50 -Dfile.encoding=UTF-8}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    read_only: true
    # JNI/JNA extract shared libraries here: this mount must allow executable mappings.
    tmpfs:
      - /tmp:rw,exec,nosuid,size=256m,mode=1777
    mem_limit: ${BACKEND_MEMORY_LIMIT:-2g}
    cpus: ${BACKEND_CPU_LIMIT:-2.0}
    stop_grace_period: 30s
    restart: unless-stopped

  frontend:
    image: tass-frontend-demo:dev
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    init: true
    restart: unless-stopped

  postgres-test:
    profiles: [test]
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: tass_test
      POSTGRES_USER: tass_test
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-tass_test_demo_only}
    # Disposable test data; never share the development volume or publish its port.
    tmpfs:
      - /var/lib/postgresql/data:rw,size=1g
    volumes:
      - ./backend/sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/sql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./infra/docker/db-healthcheck.sh:/opt/tass/db-healthcheck.sh:ro
    healthcheck: *database-check

  verify:
    profiles: [test]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test-runner
    environment:
      PGHOST: postgres-test
      PGPORT: "5432"
      PGDATABASE: tass_test
      PGUSER: tass_test
      PGPASSWORD: ${TEST_DB_PASSWORD:-tass_test_demo_only}
    volumes:
      - maven_test_cache:/root/.m2
      - ./.runtime/docker-test-reports:/reports
    depends_on:
      postgres-test:
        condition: service_healthy

  migrate:
    profiles: [tools]
    image: postgres:16-bookworm
    environment: *database-tools-env
    entrypoint: [sh, /opt/tass/migrate.sh]
    volumes:
      - ./backend/sql:/migrations:ro
      - ./infra/docker/migrate.sh:/opt/tass/migrate.sh:ro
      - ./infra/docker/wait-for-db.sh:/opt/tass/wait-for-db.sh:ro
    depends_on:
      postgres:
        condition: service_started

  backup:
    profiles: [tools]
    image: postgres:16-bookworm
    environment: *database-tools-env
    entrypoint: [sh, /opt/tass/backup.sh]
    volumes:
      - ./.runtime/docker-backups:/backups
      - ./infra/docker/backup.sh:/opt/tass/backup.sh:ro
      - ./infra/docker/wait-for-db.sh:/opt/tass/wait-for-db.sh:ro
    depends_on:
      postgres:
        condition: service_started

volumes:
  postgres_data:
  maven_test_cache:
